# Paper protocol: trained NVS and shared decoder with two context views.

data:
  root: ""                    # empty -> $SCANNET_ROOT
  pairs: ALL
  image_size: 224
  n_context_views: 2
  max_target_views: null      # SIU3R protocol: all 6 target_ids of val_pair.json (incl. the 2 input views)

source_seg:
  name: shared_query
  ckpt: ckpts/panopticlvsm_scannet.pt

codec:
  name: binary
  bits: 3
  tau: 0.2
  assign: encounter

nvs:
  ckpt: ckpts/panopticlvsm_scannet.pt
  ckpt_prefix: nvs.

device: cuda:0
